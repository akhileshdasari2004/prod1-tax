# Cloudflare Pages — static Astro build output
# Dashboard: Build command `npm run build`, Output directory `dist`, Node 22+
name = "financetoolshub"
compatibility_date = "2025-06-01"
pages_build_output_dir = "dist"

# Set environment variables in Cloudflare Pages → Settings → Environment variables:
#
# Production:
#   PUBLIC_GA_MEASUREMENT_ID     = G-XXXXXXXXXX
#   PUBLIC_GOOGLE_SITE_VERIFICATION = (content from Search Console meta tag)
#   PUBLIC_BING_SITE_VERIFICATION   = (content from Bing Webmaster meta tag)
#   PUBLIC_INDEXABLE             = true
#
# Preview (*.pages.dev):
#   PUBLIC_INDEXABLE             = false
#   (leave GA / verification empty on preview)

[vars]
SITE_URL = "https://financetoolshub.com"
